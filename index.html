
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RJ - DHT11 Monitoring</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <h1>
            RJ Beboso
        </h1>

        <p>
            Temperature & Humidity Monitoring
        </p>

    </header>


    <!-- =========================================
         FIREBASE STATUS
    ========================================== -->

    <div
        id="firebaseStatus"
        class="status"
    >
        Firebase Status: Connecting...
    </div>


    <!-- =========================================
         CURRENT READINGS
    ========================================== -->

    <section class="current-section">

        <div class="sensor-card">

            <h2>
                🌡️ Temperature
            </h2>

            <div
                id="currentTemperature"
                class="sensor-value"
            >
                -- °C
            </div>

        </div>


        <div class="sensor-card">

            <h2>
                💧 Humidity
            </h2>

            <div
                id="currentHumidity"
                class="sensor-value"
            >
                -- %
            </div>

        </div>

    </section>


    <!-- =========================================
         GRAPH
    ========================================== -->

    <section class="card">

        <div class="section-header">

            <div>

                <h2>
                    Sensor Graph
                </h2>

                <p>
                
                </p>

            </div>


            <select id="graphDate">

                <option value="">
                    Select Date
                </option>

            </select>

        </div>


        <div class="chart-container">

            <canvas
                id="sensorChart"
            ></canvas>

        </div>

    </section>


    <!-- =========================================
         HISTORY
    ========================================== -->

    <section class="card">

        <div class="history-header">

            <div>

                <h2>
                    Sensor History
                </h2>

                <p>
                    Previous DHT11 readings
                </p>

            </div>


            <button
                id="toggleHistory"
                class="blue-button"
            >
                Show History
            </button>

        </div>


        <div
            id="historyContent"
            class="hidden"
        >

            <div class="history-controls">

                <span id="recordCount">
                    0 records
                </span>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Time
                            </th>

                            <th>
                                Temperature
                            </th>

                            <th>
                                Humidity
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="historyTableBody"
                    >

                    </tbody>

                </table>

            </div>

        </div>

    </section>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>
            RJ DHT11 Monitoring System
        </p>

    </footer>

</div>


<!-- =========================================
     CHART.JS
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js"
></script>


<!-- =========================================
     FIREBASE APP
========================================== -->

<script
    type="module"
    src="script.js"
></script>

</body>

</html>
