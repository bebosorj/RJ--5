<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RJ | ESP WiFi Manager</title>


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #1e293b
                );

            color: #e5e7eb;
        }


        .wifi-card {

            width: 100%;

            max-width: 500px;

            padding: 35px;

            background:
                linear-gradient(
                    145deg,
                    #1e293b,
                    #172033
                );

            border-radius: 20px;

            border:
                1px solid
                #334155;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.45);
        }


        .wifi-icon {

            text-align: center;

            font-size: 42px;

            margin-bottom: 10px;
        }


        .wifi-card h1 {

            text-align: center;

            color: #38bdf8;

            margin-bottom: 10px;

            font-size: 28px;
        }


        .wifi-card p {

            text-align: center;

            color: #94a3b8;

            margin-bottom: 28px;

            font-size: 14px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            color: #7dd3fc;

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 14px;
        }


        .form-group input {

            width: 100%;

            padding: 13px 15px;

            border:
                1px solid
                #475569;

            border-radius: 8px;

            outline: none;

            font-size: 16px;

            color: #f8fafc;

            background: #0f172a;
        }


        .form-group input::placeholder {

            color: #64748b;
        }


        .form-group input:focus {

            border-color:
                #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(59,130,246,.15);
        }


        .wifi-button {

            width: 100%;

            margin-top: 10px;

            padding: 13px 24px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 15px;

            cursor: pointer;

            font-weight: bold;
        }


        .wifi-button:hover {

            box-shadow:
                0 6px 18px
                rgba(37,99,235,.35);
        }


        .info {

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background: #172033;

            border:
                1px solid
                #334155;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;
        }


        .info strong {

            color: #7dd3fc;
        }


        @media(max-width:600px) {

            .wifi-card {

                padding:
                    25px 20px;
            }

        }

    </style>

</head>


<body>


<div class="wifi-card">


    <div class="wifi-icon">
        📶
    </div>


    <h1>
        RJ WiFi Manager
    </h1>


    <p>
        Configure the WiFi connection
        for your ESP32.
    </p>


    <form
        action="/"
        method="POST"
    >


        <div class="form-group">

            <label for="ssid">
                WiFi SSID
            </label>

            <input
                type="text"
                id="ssid"
                name="ssid"
                placeholder="Enter WiFi name"
                required
            >

        </div>


        <div class="form-group">

            <label for="pass">
                WiFi Password
            </label>

            <input
                type="password"
                id="pass"
                name="pass"
                placeholder="Enter WiFi password"
                required
            >

        </div>


        <div class="form-group">

            <label for="ip">
                IP Address
            </label>

            <input
                type="text"
                id="ip"
                name="ip"
                placeholder="Optional - leave blank for DHCP"
            >

        </div>


        <div class="form-group">

            <label for="gateway">
                Gateway Address
            </label>

            <input
                type="text"
                id="gateway"
                name="gateway"
                placeholder="Optional - leave blank for DHCP"
            >

        </div>


        <button
            type="submit"
            class="wifi-button"
        >

            Save

        </button>


    </form>


    <div class="info">

        <strong>
            WiFi Setup
        </strong>

        <br><br>

        Connect your phone or PC to:

        <strong>
            ESP-WIFI-MANAGER
        </strong>

        <br>

        Open:

        <strong>
            192.168.4.1
        </strong>

        <br>

        Enter your WiFi information
        and click Save.

    </div>


</div>


</body>

</html>
